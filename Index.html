<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Deutsch">
<meta name="theme-color" content="#0f0f14">
<title>Deutsch Trainer</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,700;1,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0f14;--surface:#17171f;--border:#2a2a38;--text:#e8e6f0;--muted:#6b6880;
  --der:#4f8ef7;--die:#f74f8e;--das:#4ff7a0;--wrong:#f74f4f;--card-bg:#1c1c26;
  --dativ:#f7c44f;--akk:#b04ff7;--gen:#4fd4f7;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;overflow:hidden;overscroll-behavior:none}
body{display:flex;flex-direction:column;align-items:center;min-height:100vh;min-height:-webkit-fill-available;padding:env(safe-area-inset-top,14px) 14px env(safe-area-inset-bottom,14px)}

.nav{width:100%;max-width:440px;display:flex;justify-content:space-between;align-items:center;padding:6px 0 10px}
.nav-title{font-family:'Fraunces',serif;font-size:19px;font-weight:700;letter-spacing:-.5px}
.nav-title span{font-style:italic;font-weight:300;color:var(--muted)}
.stats-btn{background:var(--surface);border:1px solid var(--border);color:var(--muted);font-family:'DM Mono',monospace;font-size:10px;padding:5px 10px;border-radius:20px;cursor:pointer}
.stats-btn:active{background:var(--border)}

.install-banner{width:100%;max-width:440px;background:color-mix(in srgb,var(--der) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--der) 30%,transparent);border-radius:11px;padding:9px 13px;font-size:11px;color:var(--muted);margin-bottom:10px;display:none;line-height:1.5}
.install-banner.show{display:block}
.install-banner strong{color:var(--text)}

.module-tabs{width:100%;max-width:440px;display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.module-tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);cursor:pointer;text-align:center;transition:all .2s;white-space:nowrap;letter-spacing:.04em}
.tab.active{color:var(--text);border-color:var(--der);background:color-mix(in srgb,var(--der) 10%,var(--surface))}
.tab:active{opacity:.7}

.progress-wrap{width:100%;max-width:440px;display:flex;align-items:center;gap:10px;margin-bottom:8px}
.progress-bar{flex:1;height:3px;background:var(--border);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--der),var(--die));transition:width .4s ease}
.progress-label{font-size:10px;color:var(--muted);min-width:32px;text-align:right}
.streak-row{font-size:11px;color:var(--muted);margin-bottom:8px;letter-spacing:.05em}
.streak-row strong{color:#f7a74f;font-weight:400}

.card-wrap{width:100%;max-width:440px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.card{width:100%;background:var(--card-bg);border:1px solid var(--border);border-radius:22px;padding:28px 22px 22px;text-align:center;position:relative;overflow:hidden;transition:border-color .3s}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--der),var(--die),var(--das));opacity:.4}
.card.correct{border-color:var(--das);animation:pulse-c .4s ease}
.card.wrong{border-color:var(--wrong);animation:shake .4s ease}
@keyframes pulse-c{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.retry-badge{position:absolute;top:10px;right:10px;background:color-mix(in srgb,var(--wrong) 15%,var(--surface));border:1px solid color-mix(in srgb,var(--wrong) 40%,transparent);border-radius:7px;font-size:9px;color:var(--wrong);padding:2px 6px;letter-spacing:.08em;display:none}
.word-cat{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.word{font-family:'Fraunces',serif;font-size:42px;font-weight:700;line-height:1.05;letter-spacing:-1.5px;margin-bottom:6px;word-break:break-word}
.word-sub{font-size:12px;color:var(--muted);min-height:16px;transition:opacity .3s;line-height:1.45;white-space:pre-wrap}
.word-sub.hidden{opacity:0}
.feedback{margin-top:12px;font-size:12px;min-height:40px;opacity:0;transition:opacity .25s;letter-spacing:.03em;line-height:1.5;white-space:pre-wrap;font-family:'DM Mono',monospace}
.feedback.show{opacity:1}
.feedback.correct-fb{color:var(--das)}
.feedback.wrong-fb{color:var(--wrong)}

.session-complete{display:none;text-align:center;flex-direction:column;align-items:center;gap:12px}
.session-complete.show{display:flex}
.sc-emoji{font-size:52px}.sc-title{font-family:'Fraunces',serif;font-size:26px;font-weight:700;letter-spacing:-1px}
.sc-sub{font-size:12px;color:var(--muted)}
.sc-btn{background:var(--card-bg);border:1px solid var(--border);color:var(--text);font-family:'Fraunces',serif;font-size:16px;padding:13px 32px;border-radius:13px;cursor:pointer;margin-top:6px}

.art-buttons{width:100%;max-width:440px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.btn{padding:13px 6px;border-radius:13px;border:1px solid var(--border);font-family:'Fraunces',serif;font-size:21px;font-weight:700;cursor:pointer;transition:all .15s;background:var(--surface);color:var(--text);letter-spacing:-1px;position:relative;overflow:hidden}
.btn::after{content:'';position:absolute;inset:0;opacity:0;transition:opacity .15s;border-radius:inherit}
.btn:active::after{opacity:.15}.btn:active{transform:scale(.96)}
.btn .lbl{display:block;font-family:'DM Mono',monospace;font-size:9px;font-weight:300;letter-spacing:.1em;color:var(--muted);margin-top:2px;text-transform:uppercase}
.btn-der{color:var(--der);border-color:color-mix(in srgb,var(--der) 30%,transparent)}.btn-der::after{background:var(--der)}
.btn-die{color:var(--die);border-color:color-mix(in srgb,var(--die) 30%,transparent)}.btn-die::after{background:var(--die)}
.btn-das{color:var(--das);border-color:color-mix(in srgb,var(--das) 30%,transparent)}.btn-das::after{background:var(--das)}
@keyframes flash-g{50%{background:color-mix(in srgb,var(--das) 20%,var(--surface))}}
@keyframes flash-r{50%{background:color-mix(in srgb,var(--wrong) 20%,var(--surface))}}
.flash-correct{animation:flash-g .4s ease}.flash-wrong{animation:flash-r .4s ease}

.caso-buttons{width:100%;max-width:440px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:12px}
.btn-dativ{color:var(--dativ);border-color:color-mix(in srgb,var(--dativ) 30%,transparent);font-size:12px;padding:15px 4px;letter-spacing:.03em}
.btn-dativ::after{background:var(--dativ)}
.btn-akk{color:var(--akk);border-color:color-mix(in srgb,var(--akk) 30%,transparent);font-size:12px;padding:15px 4px;letter-spacing:.03em}
.btn-akk::after{background:var(--akk)}
.btn-gen{color:var(--gen);border-color:color-mix(in srgb,var(--gen) 30%,transparent);font-size:12px;padding:15px 4px;letter-spacing:.03em}
.btn-gen::after{background:var(--gen)}

.hint-row{width:100%;max-width:440px;display:flex;justify-content:center;margin-top:8px}
.hint-btn{background:none;border:none;font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);cursor:pointer;padding:5px 14px;border-radius:20px}
.hint-btn:active{color:var(--text)}

/* PREPLIST */
.preplist-wrap{width:100%;max-width:440px;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:20px}
.pg-group{margin-bottom:20px}
.pg-label{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin-bottom:8px}
.pg-item{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:6px}
.pg-prep{font-family:'Fraunces',serif;font-size:19px;font-weight:700;margin-bottom:3px}
.pg-example{font-size:11px;color:var(--muted);margin-bottom:4px;white-space:pre-line;line-height:1.4}
.pg-tr{font-size:11px;color:#3a3a50;font-style:italic}

/* STATS */
.stats-screen{display:none;position:fixed;inset:0;background:var(--bg);z-index:100;flex-direction:column;align-items:center;padding:env(safe-area-inset-top,14px) 14px env(safe-area-inset-bottom,14px);overflow-y:auto}
.stats-screen.active{display:flex}
.stats-hdr{width:100%;max-width:440px;display:flex;justify-content:space-between;align-items:center;padding:6px 0 16px}
.stats-hdr h2{font-family:'Fraunces',serif;font-size:20px;font-weight:700}
.close-btn{background:var(--surface);border:1px solid var(--border);color:var(--muted);font-size:15px;width:32px;height:32px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.stats-grid{width:100%;max-width:440px;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.stat-card{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:14px 10px;text-align:center}
.stat-val{font-family:'Fraunces',serif;font-size:28px;font-weight:700;letter-spacing:-1px;line-height:1}
.stat-lbl{font-size:9px;color:var(--muted);margin-top:3px;letter-spacing:.1em;text-transform:uppercase}
.sec-title{width:100%;max-width:440px;font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin-bottom:8px;margin-top:2px}
.hard-list{width:100%;max-width:440px;display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.hard-row{background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:9px 13px;display:flex;justify-content:space-between;align-items:center}
.hard-name{font-family:'Fraunces',serif;font-size:15px}
.hard-meta{font-size:10px;color:var(--muted);text-align:right}
.hard-bar{height:3px;background:var(--border);border-radius:99px;overflow:hidden;margin-top:3px;width:60px}
.hard-fill{height:100%;border-radius:99px;background:var(--wrong)}
.reset-btn{width:100%;max-width:440px;background:none;border:1px solid var(--border);color:var(--muted);font-family:'DM Mono',monospace;font-size:11px;padding:11px;border-radius:10px;cursor:pointer;margin:6px 0 20px}
</style>
</head>
<body>

<div id="main" style="display:flex;flex-direction:column;align-items:center;width:100%;flex:1">
  <nav class="nav">
    <div class="nav-title">Deutsch <span>Trainer</span></div>
    <button class="stats-btn" onclick="showStats()">stats →</button>
  </nav>

  <div id="install-banner" class="install-banner">
    <strong>💡 iPhone:</strong> Safari → compartir □↑ → "Agregar a pantalla de inicio"
    <br><span onclick="dismissInstall()" style="color:var(--der);cursor:pointer">Entendido ✕</span>
  </div>

  <div class="module-tabs">
    <button class="tab active" id="tab-artikel"  onclick="switchModule('artikel')">🔤 Artículos</button>
    <button class="tab"        id="tab-caso"     onclick="switchModule('caso')">⚡ Caso</button>
    <button class="tab"        id="tab-frase"    onclick="switchModule('frase')">📝 Frase</button>
    <button class="tab"        id="tab-preplist" onclick="switchModule('preplist')">📋 Lista</button>
  </div>

  <div class="progress-wrap" id="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    <div class="progress-label" id="progress-label">0/20</div>
  </div>
  <div class="streak-row" id="streak-row">racha: <strong id="streak-num">0</strong> ✦</div>

  <!-- TRAINING AREA -->
  <div class="card-wrap" id="card-wrap">
    <div class="card" id="main-card">
      <div id="retry-badge" class="retry-badge">↩ Wiederholung</div>
      <div class="word-cat"  id="word-cat">—</div>
      <div class="word"      id="word-display">—</div>
      <div class="word-sub hidden" id="word-sub">—</div>
      <div class="feedback"  id="feedback"></div>
    </div>
    <div class="session-complete" id="session-complete">
      <div class="sc-emoji" id="sc-emoji">🎯</div>
      <div class="sc-title" id="sc-title">Sehr gut!</div>
      <div class="sc-sub"   id="sc-sub"></div>
      <button class="sc-btn" onclick="startSession()">Neue Runde</button>
    </div>
  </div>

  <!-- PREPLIST VIEW -->
  <div class="preplist-wrap" id="preplist-view" style="display:none"></div>

  <!-- BUTTONS -->
  <div class="art-buttons" id="art-buttons">
    <button class="btn btn-der" onclick="answerArtikel('der')" id="btn-der">der<span class="lbl">maskulin</span></button>
    <button class="btn btn-die" onclick="answerArtikel('die')" id="btn-die">die<span class="lbl">feminin</span></button>
    <button class="btn btn-das" onclick="answerArtikel('das')" id="btn-das">das<span class="lbl">neutrum</span></button>
  </div>

  <div class="caso-buttons" id="caso-buttons" style="display:none">
    <button class="btn btn-dativ" onclick="answerCaso('dativ')"     id="btn-dativ">Dativ<span class="lbl">dem/der</span></button>
    <button class="btn btn-akk"   onclick="answerCaso('akkusativ')" id="btn-akk">Akkus.<span class="lbl">den/die/das</span></button>
    <button class="btn btn-gen"   onclick="answerCaso('genitiv')"   id="btn-gen">Genitiv<span class="lbl">des/der</span></button>
  </div>

  <div class="hint-row" id="hint-row">
    <button class="hint-btn" onclick="showHint()">Übersetzung zeigen</button>
  </div>
</div>

<!-- STATS -->
<div class="stats-screen" id="stats-screen">
  <div class="stats-hdr"><h2>Statistik</h2><button class="close-btn" onclick="hideStats()">✕</button></div>
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-val" id="s-total">0</div><div class="stat-lbl">Versuche</div></div>
    <div class="stat-card"><div class="stat-val" id="s-acc">–</div><div class="stat-lbl">Genauigkeit</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--der)" id="s-streak">0</div><div class="stat-lbl">Beste Serie</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--das)" id="s-mastered">0</div><div class="stat-lbl">Gemeistert</div></div>
  </div>
  <div class="sec-title">Schwierigste Artikel</div>
  <div class="hard-list" id="hard-words"></div>
  <div class="sec-title">Schwierigste Präpositionen</div>
  <div class="hard-list" id="hard-preps"></div>
  <button class="reset-btn" onclick="confirmReset()">↺ Fortschritt zurücksetzen</button>
</div>

<script>
// ── VOCAB ──────────────────────────────────────────────

// ── ESTADO ─────────────────────────────────────────────
const SESSION_SIZE=20, T_OK=1400, T_ERR=2800;
let mod='artikel';
let state=loadState();
let session={queue:[],index:0,correct:0,current:null,retryPending:[]};
let streak=0, best=state.best||0, locked=false;

function loadState(){try{const s=localStorage.getItem('dtrainerv3');if(s)return JSON.parse(s);}catch(e){}return{sc:{},ps:{},best:0,ta:0,tc:0};}
function save(){localStorage.setItem('dtrainerv3',JSON.stringify(state));}
function wW(w){const s=state.sc[w.w]||{c:0,e:0};const t=s.c+s.e;return t===0?3:1+(s.e/t)*8;}
function wP(p){const k=p.prep+(p.caso||'');const s=state.ps[k]||{c:0,e:0};const t=s.c+s.e;return t===0?3:1+(s.e/t)*8;}

function buildQ(pool,wFn){
  const wts=pool.map(wFn),tot=wts.reduce((a,b)=>a+b,0);
  const q=[],used=new Set();let att=0;
  while(q.length<SESSION_SIZE&&att<3000){att++;
    let r=Math.random()*tot,cum=0;
    for(let i=0;i<pool.length;i++){cum+=wts[i];if(r<=cum){if(!used.has(i)){used.add(i);q.push({...pool[i],isRetry:false});}break;}}
    if(used.size===pool.length)break;}
  return q;
}

// ── SWITCH ──────────────────────────────────────────────
function switchModule(m){
  mod=m;
  ['artikel','caso','frase','preplist'].forEach(x=>document.getElementById('tab-'+x).className='tab'+(x===m?' active':''));
  if(m==='preplist'){renderPrepList();return;}
  hidePrepList(); startSession();
}

function showUI(){
  hidePrepList();
  document.getElementById('card-wrap').style.display='';
  document.getElementById('progress-wrap').style.display='';
  document.getElementById('streak-row').style.display='';
  document.getElementById('main-card').style.display='';
  document.getElementById('art-buttons').style.display=mod==='artikel'?'':'none';
  document.getElementById('caso-buttons').style.display=mod==='caso'?'':'none';
  document.getElementById('hint-row').style.display=mod==='preplist'?'none':'';
  let fb=document.getElementById('frase-buttons');if(fb)fb.remove();
}

function renderPrepList(){
  document.getElementById('card-wrap').style.display='none';
  document.getElementById('art-buttons').style.display='none';
  document.getElementById('caso-buttons').style.display='none';
  document.getElementById('hint-row').style.display='none';
  document.getElementById('progress-wrap').style.display='none';
  document.getElementById('streak-row').style.display='none';
  let fb=document.getElementById('frase-buttons');if(fb)fb.remove();
  const el=document.getElementById('preplist-view');
  el.style.display='';
  el.innerHTML=PREPLIST.map(g=>`
    <div class="pg-group">
      <div class="pg-label">${g.g}</div>
      ${g.items.map(it=>`
        <div class="pg-item">
          <div class="pg-prep" style="color:${g.col}">${it.p}</div>
          <div class="pg-example">${it.e}</div>
          <div class="pg-tr">${it.tr}</div>
        </div>`).join('')}
    </div>`).join('');
}
function hidePrepList(){document.getElementById('preplist-view').style.display='none';}

// ── SESSION ─────────────────────────────────────────────
function startSession(){
  showUI();
  document.getElementById('session-complete').classList.remove('show');
  if(mod==='artikel') session.queue=buildQ(WORDS,wW);
  else if(mod==='caso') session.queue=buildQ(PREPS_CASO,wP);
  else session.queue=buildQ(PREPS_FRASE,wP);
  session.index=0;session.correct=0;session.retryPending=[];
  streak=0;upStreak();upProgress();nextCard();
}

function nextCard(){
  if(session.retryPending.length){
    const at=Math.min(session.index+2,session.queue.length);
    session.retryPending.forEach((r,i)=>session.queue.splice(at+i,0,r));
    session.retryPending=[];
  }
  if(session.index>=session.queue.length){showComplete();return;}
  session.current=session.queue[session.index];
  locked=false;
  document.getElementById('feedback').className='feedback';
  document.getElementById('main-card').className='card';
  document.getElementById('retry-badge').style.display=session.current.isRetry?'':'none';
  document.getElementById('word-sub').classList.add('hidden');
  if(mod==='artikel') renderArtikel();
  else if(mod==='caso') renderCaso();
  else renderFrase();
  upProgress();
}

function renderArtikel(){
  const w=session.current;
  document.getElementById('word-cat').textContent=w.c;
  document.getElementById('word-display').textContent=w.w;
  document.getElementById('word-sub').textContent=w.t;
}
function renderCaso(){
  const p=session.current;
  document.getElementById('word-cat').textContent='Welcher Kasus?';
  document.getElementById('word-display').textContent=p.prep;
  document.getElementById('word-sub').textContent=p.hint+'\n'+p.tip;
  document.getElementById('word-sub').classList.remove('hidden');
}
function renderFrase(){
  const p=session.current;
  document.getElementById('word-cat').textContent='Richtige Präposition wählen · Kasus: '+p.caso;
  const parts=p.sentence.split('___');
  document.getElementById('word-display').innerHTML=
    `<span style="font-family:'Fraunces',serif;font-size:20px;font-weight:300;font-style:italic;line-height:1.6">`+
    parts[0]+`<span id="blank-span" style="display:inline-block;min-width:55px;border-bottom:2px solid var(--der);color:var(--der);font-weight:700;font-style:normal;padding:0 3px">___</span>`+(parts[1]||'')+`</span>`;
  document.getElementById('word-sub').textContent=p.tip;
  document.getElementById('word-sub').classList.remove('hidden');
  makeFraseButtons(p.options,p.blank,p.tip);
}
function makeFraseButtons(opts,correct,tip){
  let old=document.getElementById('frase-buttons');if(old)old.remove();
  const wrap=document.createElement('div');
  wrap.id='frase-buttons';
  wrap.style.cssText='width:100%;max-width:440px;display:flex;flex-direction:column;gap:7px;margin-top:12px';
  opts.forEach(opt=>{
    const b=document.createElement('button');
    b.className='btn';
    b.style.cssText='font-family:"DM Mono",monospace;font-size:14px;padding:13px;letter-spacing:.04em;color:var(--text);border-color:var(--border);border-radius:12px;background:var(--surface)';
    b.textContent=opt;
    b.onclick=()=>answerFrase(opt,correct,tip,b);
    wrap.appendChild(b);
  });
  document.getElementById('hint-row').insertAdjacentElement('beforebegin',wrap);
}

// ── ANSWERS ─────────────────────────────────────────────
function answerArtikel(chosen){
  if(locked)return;locked=true;
  const c=session.current,ok=chosen===c.a;
  if(!state.sc[c.w])state.sc[c.w]={c:0,e:0};
  state.ta=(state.ta||0)+1;
  if(ok){state.sc[c.w].c++;state.tc=(state.tc||0)+1;streak++;if(streak>best){best=streak;state.best=best;}session.correct++;}
  else{state.sc[c.w].e++;streak=0;}
  upStreak();save();
  const card=document.getElementById('main-card'),fb=document.getElementById('feedback');
  const m={der:'btn-der',die:'btn-die',das:'btn-das'};
  document.getElementById('word-sub').classList.remove('hidden');
  if(ok){card.classList.add('correct');fb.className='feedback show correct-fb';fb.textContent='✓ '+c.a+' '+c.w;document.getElementById(m[chosen]).classList.add('flash-correct');}
  else{card.classList.add('wrong');fb.className='feedback show wrong-fb';fb.textContent='✗ '+c.a+' '+c.w+'\n  nicht "'+chosen+'"';document.getElementById(m[chosen]).classList.add('flash-wrong');document.getElementById(m[c.a]).style.background=c.a==='der'?'rgba(79,142,247,.2)':c.a==='die'?'rgba(247,79,142,.2)':'rgba(79,247,160,.2)';if(!c.isRetry)session.retryPending.push({...c,isRetry:true});}
  session.index++;
  setTimeout(()=>{['btn-der','btn-die','btn-das'].forEach(id=>{const b=document.getElementById(id);b.className=b.className.replace(/ flash-(correct|wrong)/g,'');b.style.background='';});nextCard();},ok?T_OK:T_ERR);
}

function answerCaso(chosen){
  if(locked)return;locked=true;
  const c=session.current,ok=chosen===c.caso;
  const k=c.prep+(c.caso||'');if(!state.ps[k])state.ps[k]={c:0,e:0,l:c.prep};
  if(ok){state.ps[k].c++;session.correct++;streak++;if(streak>best){best=streak;state.best=best;}}
  else{state.ps[k].e++;streak=0;if(!c.isRetry)session.retryPending.push({...c,isRetry:true});}
  upStreak();save();
  const card=document.getElementById('main-card'),fb=document.getElementById('feedback');
  const idMap={dativ:'btn-dativ',akkusativ:'btn-akk',genitiv:'btn-gen'};
  if(ok){card.classList.add('correct');fb.className='feedback show correct-fb';fb.textContent='✓ '+c.caso+'\n→ '+c.ejemplo;document.getElementById(idMap[chosen]).classList.add('flash-correct');}
  else{card.classList.add('wrong');fb.className='feedback show wrong-fb';fb.textContent='✗ '+c.caso+', nicht '+chosen+'\n→ '+c.ejemplo;['btn-dativ','btn-akk','btn-gen'].forEach(id=>{const b=document.getElementById(id);if(b)b.classList.remove('flash-correct','flash-wrong');});}
  session.index++;
  setTimeout(()=>{['btn-dativ','btn-akk','btn-gen'].forEach(id=>{const b=document.getElementById(id);if(b){b.classList.remove('flash-correct','flash-wrong');b.style.background='';}});nextCard();},ok?T_OK:T_ERR);
}

function answerFrase(chosen,correct,tip,btn){
  if(locked)return;locked=true;
  const c=session.current,ok=chosen===correct;
  const k=c.prep+(c.caso||'');if(!state.ps[k])state.ps[k]={c:0,e:0,l:c.blank||c.prep};
  if(ok){state.ps[k].c++;session.correct++;streak++;if(streak>best){best=streak;state.best=best;}}
  else{state.ps[k].e++;streak=0;if(!c.isRetry)session.retryPending.push({...c,isRetry:true});}
  upStreak();save();
  const card=document.getElementById('main-card'),fb=document.getElementById('feedback');
  const bl=document.getElementById('blank-span');
  if(bl){bl.textContent=chosen;bl.style.color=ok?'var(--das)':'var(--wrong)';bl.style.borderColor=ok?'var(--das)':'var(--wrong)';}
  if(ok){card.classList.add('correct');btn.style.background='color-mix(in srgb,var(--das) 20%,var(--surface))';btn.style.borderColor='var(--das)';fb.className='feedback show correct-fb';fb.textContent='✓ '+tip+'\n→ '+c.sentence.replace('___',correct);}
  else{card.classList.add('wrong');btn.style.background='color-mix(in srgb,var(--wrong) 20%,var(--surface))';btn.style.borderColor='var(--wrong)';fb.className='feedback show wrong-fb';fb.textContent='✗ "'+correct+'" — '+tip+'\n→ '+c.sentence.replace('___',correct);document.querySelectorAll('#frase-buttons .btn').forEach(b=>{if(b.textContent.trim()===correct){b.style.background='color-mix(in srgb,var(--das) 20%,var(--surface))';b.style.borderColor='var(--das)';}});}
  document.querySelectorAll('#frase-buttons .btn').forEach(b=>b.onclick=null);
  session.index++;
  setTimeout(()=>{let f=document.getElementById('frase-buttons');if(f)f.remove();nextCard();},ok?T_OK:T_ERR);
}

function showHint(){document.getElementById('word-sub').classList.remove('hidden');}
function upStreak(){document.getElementById('streak-num').textContent=streak;}
function upProgress(){const p=Math.min((session.index/SESSION_SIZE)*100,100);document.getElementById('progress-fill').style.width=p+'%';document.getElementById('progress-label').textContent=Math.min(session.index,SESSION_SIZE)+'/'+SESSION_SIZE;}

function showComplete(){
  document.getElementById('main-card').style.display='none';
  document.getElementById('art-buttons').style.display='none';
  document.getElementById('caso-buttons').style.display='none';
  document.getElementById('hint-row').style.display='none';
  let fb=document.getElementById('frase-buttons');if(fb)fb.remove();
  const pct=Math.round((session.correct/SESSION_SIZE)*100);
  const emoji=pct>=90?'🏆':pct>=70?'🎯':pct>=50?'💪':'📚';
  const title=pct>=90?'Ausgezeichnet!':pct>=70?'Sehr gut!':pct>=50?'Gut!':'Übung macht den Meister!';
  document.getElementById('sc-emoji').textContent=emoji;
  document.getElementById('sc-title').textContent=title;
  document.getElementById('sc-sub').textContent=session.correct+'/'+SESSION_SIZE+' richtig ('+pct+'%)';
  document.getElementById('session-complete').classList.add('show');
  document.getElementById('progress-fill').style.width='100%';
  document.getElementById('progress-label').textContent=SESSION_SIZE+'/'+SESSION_SIZE;
}

// ── STATS ──────────────────────────────────────────────
function showStats(){
  const ta=state.ta||0,tc=state.tc||0;
  document.getElementById('s-total').textContent=ta;
  document.getElementById('s-acc').textContent=ta>0?Math.round(tc/ta*100)+'%':'–';
  document.getElementById('s-streak').textContent=best;
  let mastered=0;
  WORDS.forEach(w=>{const s=state.sc[w.w];if(!s)return;const t=s.c+s.e;if(t>=5&&s.e/t<.2)mastered++;});
  document.getElementById('s-mastered').textContent=mastered;
  const hw=WORDS.map(w=>{const s=state.sc[w.w]||{c:0,e:0};const t=s.c+s.e;return{...w,e:s.e,t,r:t>0?s.e/t:0};}).filter(w=>w.t>=2&&w.e>0).sort((a,b)=>b.e-a.e).slice(0,8);
  document.getElementById('hard-words').innerHTML=hw.length===0?'<div style="color:var(--muted);font-size:12px;padding:6px 0">Noch keine Daten.</div>':hw.map(w=>`<div class="hard-row"><div><div class="hard-name">${w.a} ${w.w}</div><div class="hard-bar"><div class="hard-fill" style="width:${Math.min(w.r*100,100)}%"></div></div></div><div class="hard-meta">${w.e} Fehler<br>${Math.round(w.r*100)}%</div></div>`).join('');
  const hp=Object.entries(state.ps||{}).map(([k,s])=>{const t=s.c+s.e;return{k,l:s.l||k,e:s.e,t,r:t>0?s.e/t:0};}).filter(p=>p.t>=2&&p.e>0).sort((a,b)=>b.e-a.e).slice(0,8);
  document.getElementById('hard-preps').innerHTML=hp.length===0?'<div style="color:var(--muted);font-size:12px;padding:6px 0">Noch keine Daten.</div>':hp.map(p=>`<div class="hard-row"><div><div class="hard-name">${p.l}</div><div class="hard-bar"><div class="hard-fill" style="width:${Math.min(p.r*100,100)}%"></div></div></div><div class="hard-meta">${p.e} Fehler<br>${Math.round(p.r*100)}%</div></div>`).join('');
  document.getElementById('stats-screen').classList.add('active');
}
function hideStats(){document.getElementById('stats-screen').classList.remove('active');}
function confirmReset(){if(confirm('Gesamten Fortschritt zurücksetzen?')){localStorage.removeItem('dtrainerv3');state=loadState();best=0;hideStats();startSession();}}
function dismissInstall(){localStorage.setItem('inst_d','1');document.getElementById('install-banner').classList.remove('show');}

window.addEventListener('load',()=>{
  const iOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(iOS&&!window.navigator.standalone&&!localStorage.getItem('inst_d'))document.getElementById('install-banner').classList.add('show');
  startSession();
});
window.addEventListener('keydown',e=>{
  if(mod==='artikel'){if(e.key==='1')answerArtikel('der');if(e.key==='2')answerArtikel('die');if(e.key==='3')answerArtikel('das');}
  if(mod==='caso'){if(e.key==='1')answerCaso('dativ');if(e.key==='2')answerCaso('akkusativ');if(e.key==='3')answerCaso('genitiv');}
});
</script>
